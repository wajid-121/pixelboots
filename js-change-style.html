<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Change Text</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />

</head>
<script>
    function changeStyle() {
        document.getElementById("page-heading").classList.remove("text-success");

        document.getElementById("page-heading").classList.add("text-info");

    }
</script>

<body>
    <h2 id="page-heading" class="text-center text-success my-4"> Welcome to JavaScript!</h2>
    <button class="btn btn-info btn-lg ms-5" onclick="changeStyle()"> Change style</button>
</body>

</html>
