<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />

</head>
<style>
   
    .my-btn {
        border: none;
        background-color: rgb(63, 175, 226);
        border-radius: 4px;
        color: white;
        padding: 5px 50px;
        transition: 0.45s;
    }

    .my-btn:hover {
        background-color: rgb(158, 15, 187);
        transform: translateY(10px);
    }
</style>

<body>
    <div class="container py-5 text-center">
        <h2 class="text-primary">Transition Demo</h2>
        <p>Transition allows an element to change its state with smooth effect</p>
        <button class="my-btn">Hover on me</button>
        <button class="my-btn">I am also here..</button>
    </div>

</body>

</html>
