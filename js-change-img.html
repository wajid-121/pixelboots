<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>change image</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
</head>
<script>
    function changeImage() {
        document.getElementById("destination-img").src = "img/taj mahal.jpg";
    }
</script>

<body>
    <div class="my-3 p-4">
        <img id="destination-img" src="img/MUNNAR DESTINATIONS.jpg" alt="" width="400px"
            class="img-fluid rounded shadow d-block mb-4" />
        <button class="btn btn-primary btn-lg" onclick="changeImage()">Change Image</button>
    </div>

</body>

</html>
